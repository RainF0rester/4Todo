stages:
  - test
  - deploy

backend_test:
  stage: test
#  tags:
#    - test # docker runner
  image: python:3.10
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest tests --junitxml=test-report.xml --cov=. --cov-report=term-missing --cov-report=html
  artifacts:
    reports:
      junit: test-report.xml
    paths:
      - test-report.xml
      - htmlcov/
    expire_in: 10 days


deploy:
  stage: deploy
  tags:
    - tasktracker
  only:
    - main
  script:
    - cd /root/tasktracker/tasktracker
    - git pull origin main
    - bash deploy.sh